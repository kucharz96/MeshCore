name: MeshCore X Wio L1 Companion

on:
  pull_request:
    paths:
      - 'src/helpers/radiolib/**'
      - 'examples/companion_radio/**'
      - 'variants/wio-tracker-l1/**'
      - 'test/test_radio_health_metrics/**'
      - '.github/workflows/meshcore-x-wio-companion.yml'
  workflow_dispatch:

jobs:
  build:
    name: Wio Tracker L1 Pro ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - WioTrackerL1_companion_radio_ble
          - WioTrackerL1_companion_radio_usb
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up PlatformIO
        uses: ./.github/actions/setup-build-environment
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
